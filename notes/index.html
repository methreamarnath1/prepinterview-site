<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepInterview — Interview Prep Library</title>
<meta name="description" content="A multi-subject interview prep library — Python, and whatever you add next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/atelier-cave-light.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/atelier-cave-dark.min.css" disabled>
<link rel="stylesheet" href="style.css">
<script>
  /* Set theme before paint to avoid a flash of the wrong theme */
  (function () {
    var saved = localStorage.getItem("pynotes:theme");
    var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<div id="mobile-bar">
  <button id="menu-toggle" aria-label="Toggle navigation">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5H16M2 9H16M2 13H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <span class="mobile-title" id="mobile-title">PrepInterview</span>
  <div class="mobile-bar-actions">
    <button id="search-toggle" aria-label="Search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.4"/><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button id="theme-toggle-mobile" aria-label="Toggle dark mode"></button>
  </div>
</div>

<div id="app">

  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="brand-row">
        <a href="#/" class="brand"><span class="dot"></span><span id="brand-text">PrepInterview</span></a>
        <button id="theme-toggle" aria-label="Toggle dark mode"></button>
      </div>
      <div id="subject-switcher" class="subject-switcher"></div>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.4"/><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" placeholder="Search..." autocomplete="off">
      </div>
    </div>
    <nav id="nav-tree"></nav>
    <div class="sidebar-foot">
      <div class="progress-row">
        <span id="progress-text">0 / 0 read</span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
  </aside>

  <div id="sidebar-backdrop"></div>

  <main id="content-area">
    <div id="content-inner">
      <div id="loading" class="loading">Loading…</div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="app.js"></script>
</body>
</html>
